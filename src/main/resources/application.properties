spring.application.name=permission-service
server.port=${SERVER_PORT:8080}
spring.profiles.default=local
spring.docker.compose.file=${DOCKER_COMPOSE_FILE:compose.dev.yaml}

spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/permission_sample}
spring.datasource.username=${DB_USERNAME:permission_service}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:2000}
spring.datasource.hikari.validation-timeout=1000
spring.datasource.hikari.pool-name=permission-db
spring.jdbc.template.query-timeout=5

spring.flyway.url=${MIGRATION_DB_URL:jdbc:mariadb://localhost:3306/permission_metadata}
spring.flyway.user=${MIGRATION_DB_USERNAME:${DB_USERNAME:permission_service}}
spring.flyway.password=${MIGRATION_DB_PASSWORD:${DB_PASSWORD:}}
spring.flyway.placeholders.managementUser=${DB_USERNAME:permission_service}
spring.flyway.placeholders.managementPassword=${DB_PASSWORD:}

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99
springdoc.swagger-ui.path=/swagger-ui.html

permission.bulk.threads=${BULK_THREADS:4}
permission.bulk.queue-capacity=${BULK_QUEUE_CAPACITY:32}
permission.bulk.max-items=${BULK_MAX_ITEMS:100}
permission.bulk.timeout=${BULK_TIMEOUT:10s}
